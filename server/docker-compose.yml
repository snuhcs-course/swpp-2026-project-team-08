# 로컬 개발용 Postgres. 앱 자체는 호스트에서 uv 로 실행한다.
# 자격증명은 같은 디렉터리의 .env 값을 사용한다(없으면 기본값 "server").
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: server-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-server}
      POSTGRES_DB: ${POSTGRES_DB:-server}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - server-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-server}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  server-pgdata:
