name: Client CI

on:
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - ".github/workflows/client-ci.yml"

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Client / ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Tests
            command: npm test
          - name: API Tests
            command: cd ../server && uv run python -m tests.run_client_integration
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npx --no-install tsc --noEmit
    defaults:
      run:
        working-directory: client
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.0.0"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: astral-sh/setup-uv@v6
        if: matrix.check.name == 'API Tests'
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install API test dependencies
        if: matrix.check.name == 'API Tests'
        run: uv sync --frozen --project ../server
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}
